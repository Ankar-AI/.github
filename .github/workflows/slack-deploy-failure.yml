name: Slack Deploy Failure

on:
  workflow_call:
    inputs:
      emoji:
        type: string
        description: "Slack emoji identifying the app"
        required: true

jobs:
  notify:
    name: Notify Slack (workflow failure)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Send Slack message
        continue-on-error: true
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.ANKAR_BOTS_SLACK_CHANNEL_ID }}",
              "text": "The `${{ github.event.workflow_run.name }}` workflow failed on `${{ github.event.workflow_run.head_branch }}` in <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ inputs.emoji }} The `${{ github.event.workflow_run.name }}` workflow failed on `${{ github.event.workflow_run.head_branch }}` in <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>.\n\n:github: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}|Committed> by _${{ github.event.workflow_run.head_commit.author.name }}_ at `${{ github.event.workflow_run.head_commit.timestamp }}`."
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": ":logs: View job logs"
                    },
                    "url": "${{ github.event.workflow_run.html_url }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Edit this message <https://github.com/Ankar-AI/.github/blob/main/.github/workflows/slack-deploy-failure.yml|here>."
                    }
                  ]
                }
              ]
            }
